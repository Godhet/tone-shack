<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tone Shack — Guitar Amp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>TONE&nbsp;SHACK</h1>
      <div class="power">
        <button id="powerBtn" class="power-btn">POWER ON</button>
        <span id="status" class="status">standby</span>
      </div>
    </header>

    <!-- Setup row: pick your input (the Arturia) -->
    <section class="setup" id="setupRow">
      <label for="deviceSelect">Input device</label>
      <select id="deviceSelect" disabled>
        <option>— power on to detect inputs —</option>
      </select>
      <div class="meter" title="Input level — pluck a string, you should see this move">
        <div id="meterFill" class="meter-fill"></div>
      </div>
    </section>

    <!-- View tabs -->
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="amp">AMP</button>
      <button class="tab" data-view="learn">LEARN</button>
    </nav>

    <!-- ============ AMP VIEW ============ -->
    <div id="view-amp">
    <!-- Preset picker -->
    <section class="presets" id="presetRow">
      <button class="preset" data-preset="oasis-acoustic">
        <span class="p-name">Oasis</span>
        <span class="p-sub">Acoustic · Wonderwall</span>
      </button>
      <button class="preset" data-preset="oasis-electric">
        <span class="p-name">Oasis</span>
        <span class="p-sub">Electric · Slide Away</span>
      </button>
      <button class="preset" data-preset="acdc">
        <span class="p-name">AC/DC</span>
        <span class="p-sub">Crunch · Back in Black</span>
      </button>
    </section>

    <!-- The amp head with knobs -->
    <section class="amp" id="amp">
      <div class="amp-brand">
        <span id="ampTitle">— pick a preset —</span>
        <span id="ampNote" class="amp-note"></span>
      </div>
      <div class="knobs" id="knobs">
        <!-- knobs injected by JS -->
      </div>
    </section>
    </div><!-- /view-amp -->

    <!-- ============ LEARN VIEW ============ -->
    <div id="view-learn" hidden>
      <nav class="tabs sub">
        <button class="tab active" data-learn="tuner">TUNER</button>
        <button class="tab" data-learn="chord">CHORD TRAINER</button>
      </nav>

      <!-- Tuner -->
      <section class="learn-panel" id="tunerPanel">
        <div class="tuner-note" id="tunerNote">—</div>
        <div class="tuner-bar">
          <div class="tuner-center"></div>
          <div class="tuner-needle" id="tunerNeedle"></div>
        </div>
        <div class="tuner-cents" id="tunerCents">pluck a single string</div>
        <div class="tuner-strings">
          <span data-s="E">E</span><span data-s="A">A</span><span data-s="D">D</span>
          <span data-s="G">G</span><span data-s="B">B</span><span data-s="e">e</span>
        </div>
      </section>

      <!-- Chord trainer -->
      <section class="learn-panel" id="chordPanel" hidden>
        <div class="chord-target">
          <span class="chord-label">Play:</span>
          <span class="chord-name" id="chordName">D</span>
        </div>
        <div class="chord-diagram" id="chordDiagram"></div>
        <div class="chord-status" id="chordStatus">strum it…</div>
        <div class="chord-hearing" id="chordHearing"></div>
        <div class="chord-progress" id="chordProgress"></div>
      </section>
    </div><!-- /view-learn -->

    <p class="hint">
      Beginner tip: pluck a string and watch the meter above. No movement = wrong input
      device or your Arturia's gain knob is down. Presets do the rest.
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
